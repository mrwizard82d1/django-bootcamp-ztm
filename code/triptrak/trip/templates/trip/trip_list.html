<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trips List</title>
</head>
<body>
   <h1>My Trips</h1>
   {% if user.is_authenticated %}
       <p>Logged in as {{  user.username }}</p>
       <p><a href="{% url 'logout' %}">Logout</a></p>
   {% else %}
       <p>Please <a href="{% url 'login' %}">Login</a></p>
   {% endif %}
   <ul>
       {% for trip in trips %}
           <li>{{ trip.city }} | {{ trip.country }}</li>
       {% endfor %}
   </ul>
</body>
</html>
